[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta_builder_brain"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "meta-telemetry",
    "meta-config",
    "meta_polymorph",
    "meta_compiler",
    "pydantic",
    "sqlalchemy",
    "httpx",
    "anthropic>=1.1.0",
    "pytest>=9.1.1",
    "datamodel-code-generator>=0.75.1",
    "openai>=3.5.0",
    "pydantic-settings>=2.15.0",
    "json-repair>=0.63.4",
    "networkx>=3.6.1",
    "playwright>=1.62.0",
    "types-networkx>=3.6.1.20260903",
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0.20260518",
    "asyncpg>=0.31.0",
]

[project.entry-points."meta_builder.config_schemas"]
brain_settings = "meta_builder_brain.config.settings:BrainSettings"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "mypy>=2.3.1",
    "pipdeptree>=4.2.3",
    "pylint>=4.0.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]


[tool.uv.sources]
meta-telemetry = { path = "../meta-telemetry", editable = true }
meta-config = {path = "../meta-config", editable = true}
meta_polymorph = { path = "../meta_polymorph", editable = true}
meta_compiler = { path = "../meta_compiler", editable = true}


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
