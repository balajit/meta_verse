[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-config"
version = "0.1.0"
description = "Enterprise-grade settings management, boot validation, and secret injection for meta ecosystem services."
readonly = true
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Core Infrastructure Team", email = "architecture@meta.internal" }
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "hvac>=2.1.0",
    "meta-telemetry",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.2.0",
    "pipdeptree>=2.20.0",
    "uv>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_config"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=meta_config --cov-report=term-missing --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pylint.main]
py-version = "3.11"
fail-under = 9.5
jobs = 0

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "R0903", # too-few-public-methods
]

[tool.uv.sources]
meta-telemetry = { path = "../meta-telemetry", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pipdeptree>=4.2.3",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]