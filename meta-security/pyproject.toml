[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-security"
version = "0.1.0"
description = "Token validation, claim extraction, and security policy context wrappers."
requires-python = ">=3.13"
dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "meta-telemetry",
    "meta-config"
]

[project.optional-dependencies]
dev = [
    "uv",
    "mypy",
    "pipdeptree",
    "pytest",
    "ruff",
    "pylint"
]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_security"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
strict = true
disallow_untyped_defs = true

[tool.uv.sources]
meta-telemetry={path="../meta-telemetry", editable=true}
meta-config={path="../meta-config", editable=true}

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]



