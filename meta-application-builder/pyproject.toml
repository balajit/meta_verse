[project]
name = "meta-application-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "logging>=0.4.9.6",
    "meta_compiler",
    "networkx>=3.6.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.16.5",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uliweb-alembic>=0.6.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "rope>=1.14.0",
]

[tool.uv.sources]
meta_compiler = { path = "../meta_compiler", editable = true }


[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

# Ignore missing type stubs for third-party libraries without built-in types
[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "opentelemetry.*",
    "httpx.*",
]
ignore_missing_imports = true



