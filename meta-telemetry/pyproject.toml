[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-telemetry"
version = "0.1.0"
description = "Lightweight OpenTelemetry API instrumentation and structured JSON logging for platform services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pipdeptree>=4.2.3",
    "pylint>=4.0.8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.8",
    "opentelemetry-sdk>=1.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_telemetry"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asynchronous test handler",
]

[tool.pylint.main]
py-version = "3.13"
fail-under = 9.0

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "broad-exception-caught",
]