[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-builder"
version = "0.1.0"
description = "Orchestration CLI binding meta_brain, meta_polymorph, meta_compiler, and meta_control_plane."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "meta-builder-brain",
    "meta-polymorph",
    "meta-compiler",
    "meta-control-plane",
]

[project.scripts]
meta-builder = "meta_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_builder"]

[tool.uv.sources]
meta-builder-brain = { path = "../meta_builder_brain", editable = true }
meta-polymorph = { path = "../meta_polymorph", editable = true }
meta-compiler = { path = "../meta_compiler", editable = true }
meta-control-plane = { path = "../meta_control_plane", editable = true }
